<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/audio.js" defer></script>
</head>
<body>
    <div class="turntable">
        <div class="controls_one">
            <button class="stop">Off</button>
            <button class="next">>></button>
        </div>
        <div class="wheel"></div>
        <div class="controls_two">
            <div class="armTone"><img src="images/armTone.svg" alt="" srcset="">
        </div>
        <div class="volumen">
            <input type="range" min="0" max="1" value="0.5" step="any" class="range" />
        </div>
    </div>  
</body>
</html>
