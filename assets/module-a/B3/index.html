<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lines and Dots Animation</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 2rem;
        height: 100vh;
        overflow: hidden;
        background: radial-gradient(at 50%, #032442, #001224);
      }
      p {
        max-width: 600px;
        text-align: center;
        color: #ffffff;
        line-height: 1.5;
        z-index: 2;
      }
      h1 {
        font-size: 90px;
        text-align: center;
        font-weight: 900;
        line-height: 1;
        font-style: italic;
        -webkit-text-stroke: 2px #1cc8cf;
        color: transparent;
        z-index: 2;
      }
      h1 span {
        color: #1cc8cf;
      }
      .btn {
        color: white;
        border-left: 4px solid #1cc8cf;
        text-decoration: none;
        padding: 1rem 1.1rem;
        font-size: 1.2rem;
        font-weight: bold;
        z-index: 2;
      }
      .btn:hover {
        background: linear-gradient(to right, #1cc8cf30, transparent 70%);
      }
      img {
        width: 300px;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <h1>THERE IS A <br /><span>SKILL</span></h1>
    <p>
      The WorldSkills Competition is the world's biggest international skills
      competition, bringing together young people, industry, education and
      government leaders from around the world to advance Technical and
      Vocational Education and Training.
    </p>
    <a href="#" class="btn">LEARN MORE ABOUT THE EVENT</a>

    <script>
      const colors = ["#47C2E3", "#FEC85B", "#0064A8", "#1cc8cf"];
    </script>
  </body>
</html>
